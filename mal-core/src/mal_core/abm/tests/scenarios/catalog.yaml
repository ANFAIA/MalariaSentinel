E18:
  title: "Wind deflection and night blocking"
  purpose: >-
    Checks the wind branch of the movement law: a female flying against the wind
    is deflected upwind, and forward progress is blocked when the tail-wind component
    reaches her flight speed. It is the gate for the wind branch.
  setup: >-
    One host-seeking female at the centre of the synthetic study area and one
    susceptible person 40 m away to the south-west, which on the first nights is
    UPWIND of her (the wind of the field blows to the north-east). Ten days. The synthetic area carries a wind field of the 100 m wind components, loaded
    at run time. The wind is not written in the JSON; it comes from the synthetic
    area inputs.
  implies: >-
    If the female ignores the wind, the model cannot show how wind affects dispersal
    and therefore the reach of transmission. If the block never occurs, females
    would fly against strong winds at full speed. The wind is taken at 100 m, not at
    flight height, so the branch can only be validated against the synthetic area;
    this is a declared limit.
  expected: >-
    Gate. The flight is deflected upwind by up to 30 degrees ('anemotaxis_rule',
    [EP]). Forward progress is blocked when the tail-wind component, projected on
    the heading, reaches the flight speed of 0.225 to 0.45 m/s [P]. The threshold is
    computed at run time from the configured flight speed and is never hard-coded.
    A permanent night block under the measured wind is accepted as a documented
    result of the 100 m level, not as an error.
  closes: 'Step 5'
  executable_today: 'seeding-only'
  today: >-
    The wind field is loaded and the female flies against 2 to 5 m/s of 100 m wind,
    far above her flight speed: the advance towards an upwind person is blocked, and
    the first bite is on day 6, when the wind has turned; E19 (same geometry, weak
    wind) bites on day 1. This is the documented result of the 100 m level, not an
    error.
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
    - "GATE (Step 5): same geometry as E19; under the strong wind the first bite is later than the day-1 bite of E19 (or absent): the blocking rule is active"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E18 look for the female's polyline bent against
    the wind and stopping on the nights of blocked flight; the GIF draws no
    wind arrows. The wind-field values and the stage of the female per night
    are in the debug agents file.

E19:
  title: "Weak wind does not block the approach"
  purpose: >-
    Complements E18. E18 shows that a wind above her flight speed blocks the
    advance. E19 loads the same wind field scaled down to a breeze (at most
    0.2 m/s, below the blocking threshold of 0.3375 m/s) and checks that the
    wind branch does not stop a female from finding a person that is within the
    olfactory radius. Together they bracket the blocking rule from both sides.
  setup: >-
    One host-seeking female and one susceptible person 40 m away, inside the
    olfactory radius (50 m). The synthetic study area carries a weak copy of its
    wind field (the maximum speed is scaled to 0.2 m/s); the harness writes the
    copy and declares it for this scenario only. Ten days.
  implies: >-
    If the wind branch blocked or deflected the female even under a breeze, no
    female could reach anyone on a windy night and the transmission results would
    depend on the wind where the physics says they should not. A pass means that
    below the blocking threshold the wind biases the search but does not stop the
    plume tracking.
  expected: >-
    Gate. The female lands on the person (at least one successful human bite,
    stage LANDED in the debug agents file) within the ten days.
  closes: 'Step 5'
  executable_today: 'yes'
  today: >-
    The female tracks the plume under the weak wind and bites the person.
  verified_now:
    - "The run completes through the manifest route with exit code 0"
    - "GATE (Step 5): at least one successful human bite and a LANDED cascade stage"
  gif: >-
    The standard transmission GIF. For E19 look for the female's short polyline
    ending on the person dot, and a bite marker. The wind is not drawn.
