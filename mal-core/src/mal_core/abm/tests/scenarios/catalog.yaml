E00:
  title: "Minimum harness case: one seeded female"
  purpose: >-
    Checks the scenario harness itself with the smallest possible world: one
    seeded female adult, one day, and no biology. It answers whether a seeded
    individual is placed, counted and kept by the chain before any behaviour
    is tested.
  setup: >-
    One host-seeking female adult of age zero, seeded at a known position, with
    no humans, no aquatic habitat and no livestock. The run lasts one day. The
    scenario is the first step of the harness, so it also checks that the
    manifest declares exactly one scenario key.
  implies: >-
    If the seeded female is not where it was seeded, or the day-0 count differs
    from the seeded count, the harness is not reproducing its inputs and no later
    result can be trusted. A pass says only that seeding and the manifest route
    are faithful; it says nothing about movement or biology.
  expected: >-
    Position, sex and state after one day match the seeded values. These are
    verifiable by construction, not from a biological band. The manifest declares
    exactly one scenario key, scenario:E00. This is a gate that closes Step 0
    (harness and manifest route), with no tolerance band.
  closes: 'Step 0'
  executable_today: 'full'
  today: >-
    The current chain keeps the single adult in its seeded cell for the whole run
    and records one successful human bite on day 1 and none afterwards; the bite
    is drawn against the cell-aggregated human population (about 127,000 people),
    not against the seeded person
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
    - "Position pin: the agent remains in the seeded cell"
    - "GIF baseline pin: the transmission GIF of the one-day run has exactly one frame (a single slide); this is the visualiser state to be improved, not a result"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E00 the single female is one filled circle at
    its seeded position and stays inside its cell; there are no people. One
    frame, because the run lasts one day. Position, sex and state in detail
    are in the debug agents file (Step 2b).

E01:
  title: "Person beyond the activation radius"
  purpose: >-
    Tests whether a host-seeking female with a person a short distance away, but
    outside her carbon dioxide activation radius, makes contact at all. It is the
    first check of the perception cascade and the baseline of the current chain,
    recorded at Step 1.
  setup: >-
    One host-seeking female adult and one susceptible person placed just beyond
    the 100 m carbon dioxide activation radius of the female. There is no aquatic
    habitat, so the female has no breeding site to oviposit in. The run lasts
    ten days.
  implies: >-
    A pass means the perception cascade respects its activation band: a person
    outside the activation radius is not contacted, and the chain does not bite
    people the sensory model should exclude. A fail means the chain still bites at
    distances the individual geometry rules out, so the transmission numbers would
    reflect the old cell-scale contact rule instead of individual distance. In the
    field a female does not find a host she cannot sense.
  expected: >-
    The female starts outside the activation band, so she cannot bite on the first
    nights: no successful meal in the first three days. Over ten days the walk
    (590 m of path per day) may bring her within 100 m of the person; then, and
    only then, the cascade activates, tracks the plume and lands. With seed
    20261117 she activates on day 4 and bites on day 5, which the first three
    days of the previous design could not show. No oviposition, since there is
    no breeding site. A female that never finds a host dies of starvation after
    host_seeking.starvation_days (7) days; that is checked in E02.
  closes: 'Step 5'
  executable_today: 'seeding-only'
  today: >-
    The female flies the perception cascade: no bite in the first three days,
    activation on day 4 and a bite on the identified person on day 5; the bite is
    on the seeded person, not on a cell aggregate
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
    - "GATE (Step 5): no successful bite in the first three days; the female is never pinned to her cell (her net displacement stays within the 590 m daily path budget)"
    - "GIF baseline pin: three simulated days give a ten-frame GIF (the GIF unit is the day)"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E01 look for the female circle and the person
    dot 200 m apart and, a bite marker on the day she lands. The
    nightly search stage of the female (`cascade_stage`) and the bites are
    in the debug agents and bites files (Step 2b); the GIF draws no radii.

E02:
  title: "Night trajectory versus net displacement"
  purpose: >-
    Reports how far a female travels in one night and how far she ends from her
    start, when the person is far beyond any single night's reach. It checks the
    limits of the movement law, not contact, so the arrival of the female at the
    person is not a pass or fail criterion.
  setup: >-
    One host-seeking female adult and one susceptible person placed far beyond
    what the female can cover in one night, with no aquatic habitat. The run lasts
    ten days. The person stays out of reach for the whole run unless the walk
    happens to drift towards it.
  implies: >-
    The bounds say the movement law cannot produce a trajectory longer than the
    daily flight budget, nor a net shift beyond the exploration disc, so females
    cannot be carried across the landscape in one step. If either bound is
    exceeded, the macro-step or the exploration disc is wrong. A female reaching
    the person is not a failure, because the direction of the walk decides it.
  expected: >-
    Report only. Per night, the trajectory length is at most 590 m
    ('daily_move_capacity_m', [P], the mean distance travelled per day in the
    literature). Per night, the net displacement is at most 200 m, which is 2 x
    'exploration_range_m' (100 m, [EP]). The earlier band of 1,410 to 2,000 m is
    withdrawn because it cannot be reached under these bounds.
  closes: 'none'
  executable_today: 'seeding-only'
  today: >-
    The female never reaches a person 2 km away, has no meal in ten days and dies
    of starvation on day 8 (the starvation timer reaches host_seeking.starvation_days
    = 7)
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
    - "GATE (Step 5): no bite in ten days, and the death of the female is a starvation death: not before day host_seeking.starvation_days (7)"
    - "Net displacement between consecutive days never exceeds the 590 m daily path budget (read from the debug agents file)"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E02 look for the female's polyline across the
    ten days against the one-cell scale bar and the person dot 2000 m
    away. The nightly trajectory length and net displacement are read from
    the debug agents file (Step 2b), not drawn.

E03:
  title: "Several bites per night in a contact cluster"
  purpose: >-
    Checks that one mosquito can make several blood-feeding attempts in one night
    and that each attempt is logged as its own event, not folded into one
    cell-level count. It is the first test of the multi-bite ledger.
  setup: >-
    A cluster of host-seeking females with a few susceptible people placed among
    them, so that contacts occur in several places during the run, in an area with
    no aquatic habitat. The design freezes the probing success rate so that the
    expected count is a closed-form product. The JSON does not yet carry that
    override (its overrides are empty); the field enters with Step 3.
  implies: >-
    The ledger must count bites, not cell aggregates. If events per night equal
    the number of populated cells rather than the number of bites, transmission is
    understated in dense clusters and the per-person bookkeeping breaks. A pass
    confirms the multi-bite rule; a fail means the one-bite-per-night
    simplification is still present.
  expected: >-
    Gate. The number of meals equals the number of females times the probing
    success rate times the probability of contact, computed by hand before the
    code is written. The ledger records one event per bite attempt, so a night
    shows several events, not one per cell.
  closes: 'Step 3'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 3 (blood-meal physiology and multi-bite
    pickup).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E03 look for the bite markers of the day landing
    on different people. How many bites one female makes in a night, and in
    which phase, is in the debug bites file (`mosquito_uid`, `phase`,
    `host_id`).

E04:
  title: "Partial meal does not start the cycle"
  purpose: >-
    Checks that a female whose blood meal is below target does not start the
    gonotrophic cycle: she keeps host-seeking that night and nothing is laid.
  setup: >-
    One host-seeking female and one susceptible person placed next to each other,
    so a meal is possible. The intent is that the female starts with a partial
    blood volume below the target. The JSON does not yet carry a blood-volume
    field, so the partial volume is seeded when Step 3 adds it.
  implies: >-
    Without this rule a single small feed would start the cycle, overstating egg
    production and the turnover of biting females. If the cycle advances after a
    partial meal, the physiology is not using the target volume. Real females need
    a sufficient meal before they mature eggs.
  expected: >-
    Gate. After a partial meal the female remains host-seeking that night and the
    cycle does not start. The threshold is 'blood_meal_target_ul' = 0.5 uL [EP].
  closes: 'Step 3'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 3 (blood-meal volume and the cycle clock).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E04 the GIF shows only the female and the bite
    marker of the day. The partial meal and the cycle state are read from
    the debug agents file (`blood_volume_ul`, gonotrophic state).

E05:
  title: "Egg batch proportional to accumulated blood"
  purpose: >-
    Checks that the egg batch scales with the accumulated blood volume a female
    actually took, not with a fixed binomial batch, by comparing a partially fed
    female with a fully fed one.
  setup: >-
    Two host-seeking females next to the same susceptible person. One is meant to
    start with a partial blood volume and the other with a full meal. The JSON
    does not yet seed volumes, so the two females start identical until Step 3
    adds the volume field.
  implies: >-
    Egg output must follow the blood volume the female took, which is the link the
    calibration rests on. If both females lay the same batch, the model loses the
    feeding-fecundity link that the literature measures, and the egg count no
    longer responds to host access.
  expected: >-
    Gate. The egg count equals the blood volume times 223 eggs per uL [EP], rounded.
    This is calibrated so that a 0.5 uL meal gives about 112 eggs, close to the
    111.67 plus or minus 5.36 measured in coluzzii [P]. The batch is proportional
    to the accumulated volume, so the fully fed female lays more than the partial
    one.
  closes: 'Step 3'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 3 (egg batch proportional to blood
    volume).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E05 the GIF shows the two females as circles;
    the two egg batches appear as oviposition crosses at their points on the
    day they are laid. The blood volumes and batch sizes are in the debug
    agents file.

E06:
  title: "First cycle needs two meals"
  purpose: >-
    Checks that a teneral female, which has to complete a first gonotrophic cycle,
    needs two blood meals, because the first-cycle target is above the usual meal
    target.
  setup: >-
    One teneral female adult, freshly emerged, next to one susceptible person. The
    JSON seeds the teneral state; the two-meal rule comes from the first-cycle and
    usual meal targets that Step 3 introduces.
  implies: >-
    If one meal completes the first cycle, the model underestimates the time to
    first oviposition and therefore the pace at which young females transmit.
    Requiring two meals keeps the young-female pace in line with the physiology the
    plan adopts.
  expected: >-
    Gate. One meal is not enough. The female needs two, because
    'first_cycle_target_ul' = 0.8 uL [EP] is above 'blood_meal_target_ul' = 0.5 uL
    [EP]. The first cycle closes only once the first-cycle target is reached.
  closes: 'Step 3'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 3 (first-cycle target of two meals).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E06 the GIF shows the female and her bite
    markers on the two feeding days. The crossing of the first-cycle target
    is read from the debug agents file (`blood_volume_ul`).

E07:
  title: "Breeding site beats the host"
  purpose: >-
    Two assertions in one scenario. Assertion A: an emerging adult appears at the
    position of its mother cohort, not at the centre of the cell. Assertion B: a
    gravid female chooses the breeding habitat, not the host, when both are on
    offer. Assertion B needs a gravid female, which the JSON does not seed yet.
  setup: >-
    One host-seeking female, a nearly emerged pupal cohort with high development a
    short distance from her, and one person far beyond her reach. The layout puts
    the breeding site nearer than the host, so the choice is between them.
  implies: >-
    For A, emergence at the cell centre would leak the cell scale into the
    individual and lose the mother's location. For B, a female that goes to the
    person ignores the habitat signal, and biting is then driven by proximity
    rather than by the oviposition choice. Either failure would misplace the
    transmission the model reports.
  expected: >-
    Gate with two assertions. A, closing Step 7: the emergence location equals the
    mother position, not the cell centre. B, closing Step 9: the oviposition site
    is the habitat site, not the host. Oviposition in natal habitat is not modelled
    (section 16.1), so B is about choosing habitat over host, not about the natal
    site.
  closes: 'Step 7 and Step 9'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 7 (emergence at the mother position) and
    Step 9 (oviposition site choice).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
    - "Seeded pupae emerge: between one and the seeded number of adults emerge from the pupae seeded at the breeding site outside the candidate cells, so aquatic seeding at a metric position is live"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E07 look for the new female appearing on the
    mother's point and not at the cell centre (case A), and for the
    oviposition cross on the habitat site and not on the person (case B).

E08:
  title: "Two females, two persons, distinct identities"
  purpose: >-
    Checks that each person has a unique, stable identifier and that each female
    is linked to the person she is matched with. The plan closes it at Step 2
    with identifier checks: uniqueness, stability and the number of persons per
    cell.
  setup: >-
    Two host-seeking females in two cells far apart from each other, each with a
    susceptible person well inside her activation radius. The pairs are
    separated so that no female is close to the other female's person.
  implies: >-
    If person identifiers collide or change between runs, the bite ledger cannot
    say who was bitten and the individual-level transmission cannot be traced. A
    pass means each person keeps one identity; it does not by itself prove the
    choice rule of the cascade.
  expected: >-
    Gate at Step 2, verifiable by construction: each person has a unique human
    identifier that is deterministic from the seed and stable across runs (the
    earlier cell-times-slots formula was dropped by decision 2a), and the number
    of persons per cell matches the population. From Step 5 each female bites
    the person the weighted roulette picks among those inside her perception
    radius, with distance as the criterion of the stretch, and there is no
    winning cell.
  closes: 'Step 2'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 2 (individual humans with stable
    identifiers).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E08 each person is a dot, and each bite marker
    lands on exactly one of them. Person identity (`human_id`) and the bite-
    to-person link are in the debug humans and bites files.

E09:
  title: "Infective female, several persons"
  purpose: >-
    Checks the one-way rule of transmission at the bite: an infective female gives
    several infectious bites across the run when several persons are around, the
    infection can reach more than one person across the set of runs, and each
    infectious bite infects at most the person it bites.
  setup: >-
    One infective host-seeking female with three susceptible persons placed around
    her at different short distances, run for ten days. The infective flag is set
    on the mosquito and all persons start susceptible.
  implies: >-
    If one bite infects anyone other than the person bitten, the model creates
    transmission that no contact produced and inflates incidence. If the infection
    never reaches a second person across the runs, the spread between persons is
    missing and the model cannot show onward transmission.
  expected: >-
    Gate at Step 2. The run contains several infectious bites; the probability
    that more than one person is infected is above zero; each infectious bite
    infects at most the person bitten. The check is structural, not a fixed band.
  closes: 'Step 2'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 2 (individual humans and the per-bite
    ledger).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E09 the infective female carries a red ring;
    after an infectious bite only the bitten person's dot changes from S to
    E colour, never a neighbour's. The `new_infection` flag of the debug
    bites file records which bite did it.

E10:
  title: "Sensitivity to the three perception radii"
  purpose: >-
    Quantifies how much each stage of the sensory cascade (carbon dioxide
    activation, olfactory tracking, visual approach) moves the outcome, by sweeping
    one radius at a time. It is a report: it measures sensitivity and does not
    gate.
  setup: >-
    One host-seeking female at (5200, 5200) and one susceptible person, ten days,
    nine variants, one override each. The person is placed at a distance chosen
    so that the value of the radius decides whether they are inside or outside
    the band: for the carbon dioxide activation radius (50, 100 and 200 m) at
    150 m; for the olfactory radius (10, 30 and 70 m) at 60 m; for the visual
    radius (0.25, 0.485 and 0.72 m) at 0.5 m. The other radii keep their
    defaults. What each variant shows is therefore what happens when the same
    person is outside or inside that band at the start.
  implies: >-
    The result shows which radius the outcome depends on. If the outcome barely
    moves across a sweep, that stage is doing little work and the cascade is poorly
    identified there; if it moves a lot, the default needs evidence, which the plan
    marks as [EP] where there is none. This tells the team which radius to
    calibrate first.
  expected: >-
    Report only, with no pass or fail. For each variant the observed contacts and
    outcome are written next to the default run. The plan gives no band here,
    because the sweep is itself the result.
  closes: 'none'
  executable_today: 'seeding-only'
  today: >-
    The overrides are applied by the engine (cascade keys of the species row).
    The visual radius moves only the tick count of the last half metre, so its
    three variants are expected to bite on the same day; the activation and
    olfactory radii move the day of the first bite.
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E10 there is one GIF per variant (nine). The GIF draws
    no radii: variants are compared on the day the first bite appears and on
    the polyline, and in detail on `cascade_stage` in the debug agents file.
    If the variants look identical, the overrides may not be reaching the
    engine.

E11:
  title: "Postprandial window after a full meal"
  purpose: >-
    Checks that a female that has completed a meal cannot try again before the
    postprandial window closes, and records how the return to host-seeking rises
    afterwards. The window is a gate; the reopening curve is reported only.
  setup: >-
    One host-seeking female, fed on day zero, in the same cell as a susceptible
    person, so that she would try to feed again at once if no window existed. The
    JSON does not yet seed a fed state; the fed state comes from the Step 3
    physiology.
  implies: >-
    If the female bites again immediately, the blood-feeding rate is too high and
    transmission is inflated. The reopening curve describes how fast a fed female
    resumes host-seeking. It is an estimate without a direct source, so it is
    reported with its band, not gated.
  expected: >-
    Gate. The first attempt after the target is reached is not before 12 hours,
    given 'blood_meal_refractory_days' = 0.5 day [EP], and falls in a band of 12
    hours plus one phase. Reported only, with [EP] tier: progressive reopening of 7
    percent at 40 hours, 27 percent at 48 hours and 68 percent at 72 hours. The
    reopening is not a failure criterion.
  closes: 'Step 3'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 3 (post-meal refractory window).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E11 the daily frame shows the female and her
    bite marker; the 12-hour postprandial window is not visible at day
    resolution. Read the time of the first new attempt from the `phase` and
    `tick` of the debug bites file.

E12:
  title: "Ovarian arrest in the dry season"
  purpose: >-
    Checks that the fraction of fed females that stop ovarian development during a
    dry spell (arrest, not death) falls inside the published band for coluzzii. The
    band is the published data, not a parameter of the scenario.
  setup: >-
    A group of host-seeking females in one cell, with a few persons nearby, run
    for thirty days. The environment has a burst of rain followed by a long dry
    spell, set in the climate input rather than in the scenario file. The cell has
    no eligible breeding site during the dry spell, so fed females cannot lay.
  implies: >-
    If too few females arrest, dry-season egg production and population are too
    high and the seasonal dip the data show is missing. If too many arrest, the
    recovery after the dry season is overstated. Because the band is published
    data, a fail points to the model, not to a tuned parameter.
  expected: >-
    Gate. The fraction of fed females that do not pass stage 2 lies within 19.23 to
    34.85 percent, the published range for coluzzii [P]. The scenario measures the
    fraction and compares it with the band; the band is not adjusted.
  closes: 'Step 6'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 6 (arrested state and the dry-spell
    trigger).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E12 look for the female circles with the third
    visual treatment of the arrested state (not a new palette colour)
    growing in number during the dry spell. The `ovarian_stage` of each
    female is in the debug agents file.

E13:
  title: "Males and mating supply at one swarm site"
  purpose: >-
    Reports the mating supply one swarm site can offer and how many females remain
    uninseminated after three nights. It is a report, not a gate, because the
    plan derives its band by hand from the supply formula before the code is
    written.
  setup: >-
    Equal numbers of freshly emerged females and males in a single 1 square km
    cell, all of whom can reach one swarm site, so every male and female is
    assigned to it. Some males may stay loose, and the scenario measures how many.
    The swarm marker density is meant to be fixed in the scenario; the JSON does
    not yet carry it, and the value enters with Step 8.
  implies: >-
    If the supply is far from the formula, the mating model is inconsistent with
    the published rates and the uninseminated share is wrong, which matters for
    population growth after a dry spell. The report lets the team check the number
    before accepting the swarm model. Because the male count sets the number of
    pairs, a mismatch appears here first.
  expected: >-
    Report band from the formula in section 8.1. Supply per site per night equals
    the male count times 'p_mate_male_fraction' = 0.072 [P]; for 100 males that is
    7.2 pairs. Females present equal the female count times
    'female_attendance_rate' = 0.1033 [P]; for 100 females that is 10.33. The
    probability that a female is inseminated is 0.1033 x (1 - exp(-7.2/10.33)) =
    0.0518, so about 85.2 percent of females remain uninseminated after three
    nights [EP]. That figure is a lower bound, because available males decrease as
    they mate. The earlier published band of 22.3 to 52.8 percent is withdrawn
    because it cannot be derived from the formula; the implementer computes the
    report tolerance from this arithmetic.
  closes: 'none'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 8 (male site assignment and swarm supply).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
    - "Seed sensitivity: two master seeds give different mortality among the 200 seeded adults, so the sub-streams really derive from the single seed"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E13 look for the swarm site as a point marker,
    with males (hollow circles) and females near it. The inseminated count
    per night and the unmated females are in the debug mating file and in
    `inseminated` of the agents file.

E14:
  title: "Males present before the swarm window"
  purpose: >-
    Checks that freshly emerged males assigned to a site do not enter the swarm
    before their first swarm window, so they cannot inseminate a female early, and
    that the alarm for uninseminated females is raised.
  setup: >-
    One host-seeking female with a group of freshly emerged males from the same
    cell, clustered close to her, run for one day. The day ends before the males'
    first swarm window. The males carry no state beyond their sex and age. The
    female is placed close to them, so she is within reach of the site if the site
    is near.
  implies: >-
    If males enter the swarm before their window, mating happens before the males
    are physiologically ready and early insemination is overstated. If the alarm is
    missing, a broken swarm field goes unnoticed, and the alarm is the signal the
    plan uses to detect that.
  expected: >-
    Gate. No female is inseminated by males before their first swarm window. The
    alarm 'hembras_sin_inseminar' is emitted for the cell and night. The female
    attends the site only if the site lies within her reach.
  closes: 'Step 8'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 8 (male site assignment, swarm windows and
    the alarm).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E14 look for the swarm site marker and the males
    as hollow circles; the evening window is not visible at day resolution.
    Whether any male entered early, and the unmated-female alarm, are in the
    debug mating file.

E15:
  title: "Swarm killing empties the site"
  purpose: >-
    Checks that the swarm field is a static, discrete layer: killing the males
    assigned to one marker removes that site's supply, so the share of uninseminated
    females rises. It is the test that forces markers to be discrete and removable.
  setup: >-
    A field of swarm markers with one swarm in the village, equal numbers of males
    and females, run for ten days. The kill of the males assigned to one marker
    is an intervention the scenario applies. The JSON does not express the kill yet;
    the flag enters with Step 8.
  implies: >-
    If killing the males at a marker does not reduce supply, the swarm is a number
    rather than a place, and the model could not represent a targeted intervention.
    A pass supports the static site layer; a fail means site assignment does not
    reach the supply.
  expected: >-
    Gate, directional. After the kill the supply of the killed site falls to zero,
    and the share of uninseminated females is higher than in the same-seed run
    without the kill. The plan gives no numeric threshold for the rise, so the test
    checks the direction of the change and that the killed site's supply is removed.
  closes: 'Step 8'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 8 (site supply and the swarm-killing flag).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
    - "Seed sensitivity: two master seeds give different mortality among the seeded adults"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E15 look for the killed site's marker and its
    males disappearing from the day of the kill, while the other sites keep
    their males. Supply per site is in the debug mating file.

E16:
  title: "Nets at 60 percent do not offset swarm supply"
  purpose: >-
    Counter-scenario that records a model limit: individual protection from
    insecticide-treated nets at 60 percent coverage does not restore the swarm
    supply lost at a site. It is a report because the plan treats the result as a
    documented limit, not as a model output to tune.
  setup: >-
    The same swarm-site field as the swarm-killing scenario, with equal numbers of
    males and females, run for ten days, with net coverage set to 60 percent. The
    net coverage belongs to the scenario definition; the JSON does not carry a net
    field yet.
  implies: >-
    If nets appeared to restore supply, the model would be suggesting that
    individual protection can compensate for lost swarm sites, which the plan does
    not support. Keeping the limit in the report stops a reader from taking net
    coverage as a mating-supply intervention.
  expected: >-
    Report only, with no band in the plan. The report records the uninseminated
    share and the supply per site with nets and without, and states that the nets do
    not compensate for the supply loss. The plan records this as a documented limit
    of the model, not as a result.
  closes: 'none'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 8 (the swarm supply the nets are compared
    against).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
    SEIR state, mosquitoes as circles (female filled, male hollow) with a
    polyline of their daily positions, bites as point events, and a red ring
    on infected agents. For E16 the GIF shows the same swarm sites as in
