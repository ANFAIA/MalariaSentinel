E17:
  title: "Sterile males compete for site supply"
  purpose: >-
    Checks that sterile males assigned to the same swarm sites as the fertile males
    take a proportional share of the supply, so that supply per site falls with
    their number and the uninseminated share rises. It is the sterile-insect test on
    site supply.
  setup: >-
    Equal numbers of females and males assigned to the swarm sites, with sterile
    males added and assigned to the same sites, so they compete for the same supply.
    Run for ten days. The sterility flag is not in the JSON yet; it enters with
    Step 10.
  implies: >-
    If supply does not fall with the number of sterile males assigned, the model
    cannot represent sterile-insect release, an intervention a programme may run.
    Competition among individual sterile males inside a swarm is not simulated
    (N11, section 8.6), so the test covers supply per site, not competition within
    the swarm.
  expected: >-
    Gate. Supply per site falls in proportion to the number of sterile males
    assigned to it, and the uninseminated female share rises. The Step 10 criterion
    also requires that two identical runs match byte for byte (Level 5).
  closes: 'Step 10'
  executable_today: 'seeding-only'
  today: >-
    Not meaningful yet: depends on Step 10 (sterile males on the site supply).
  verified_now:
    - "Seeding fidelity: the adult population obeys the conservation identity on every day (adults today = adults yesterday - deaths + emerged, starting from the seeded count), so no seeded individual is dropped or invented; the cohort log and the raster output agree on the number of adults"
    - "The run completes through the manifest route ('validate_completeness', resolve, binary) with exit code 0"
  gif: >-
    The standard transmission GIF: one frame per simulated day, cells in
    neutral grey, a one-cell scale bar, people as 1-pixel dots coloured by
