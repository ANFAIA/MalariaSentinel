# model_constants.yaml — ÚNICA fuente de parámetros del modelo (py ⇄ C++).
# Formato: subconjunto YAML plano parseable por mal_abm_fast/config.hpp (sin yaml-cpp).
# Toda clave es OBLIGATORIA; loaders fallan listando faltantes. Unidades entre [ ].
# 'frozen' = contrato; cambiar requiere version-bump + PR de contratos.

version: 3                                # [int] versión del esquema; bump obligatorio en cambio frozen (3: individuos humanos, cascada de movimiento, sangre, seca, machos)

contracts:              # contratos congelados de entrada/salida (plan §9.3)
  env_nc: "3.0"         # [string] contrato del env NC (entrada habitat; daily_nc.py)
  cogs_state: "4.0"     # [string] contrato del state COG + sidecar (wire.hpp); pasa a "5.0" en el Paso 11, cuando el COG publica una sola banda
  habitat: "4.0"        # [string] contrato del registro de hábitat por celda; lo consume el Paso 7 (declarado desde el Paso 4)

habitat_types:          # tipos de hábitat del motor (orden = API de índice py; C++ carga por NOMBRE)
  types: [surface_persistent, wetland_persistent, urban_persistent,
          wetland_pluvial, open_pluvial, crop_pluvial]      # [lista] los 6 tipos de hábitat
  dynamics:             # [categórico] respuesta temporal k(g): persistent → A=1; pluvial → A=z
    surface_persistent:  persistent   # [categórico] agua superficial permanente
    wetland_persistent:  persistent   # [categórico] humedal/manglar permanente
    urban_persistent:    persistent   # [categórico] superficie construida permanente
    wetland_pluvial:     pluvial      # [categórico] humedal estacional (lluvia)
    open_pluvial:        pluvial      # [categórico] agua abierta estacional (lluvia)
    crop_pluvial:        pluvial      # [categórico] cultivo estacional (lluvia)

habitat:
  activation_min_engine: 0.01  # [índice] umbral S ⇒ celda parche viva (coordinator.cpp); el valor py muerto no entra (plan §5)
  candidate_min_engine: 0.01   # [índice] piso de parche del MOTOR (union coordinator + filtro gpkg);
                               # el census del ingest usa ingest.candidate_min_ingest (rol distinto)

pluvial:
  rain_scale_mm: 2.5       # [mm] escala de lluvia del relleno pluvial (valor del motor; alineado con scorers d19/d20)
  dry_memory_days: 5.0     # [días] τ_ref de memoria seca (único espejo 1:1 correcto)
  delta_days: 1.0          # [días] paso temporal normal
  cold_start_z: 0.0        # [adimensional] z inicial de arranque/warm-up

aquatic_stress:
  desicc_grace_days: 5.0        # [días] días secos de gracia antes de desecar
  desicc_base_daily: 0.10       # [1/día] techo diario del ramp de desecación
  desicc_ramp_decay: 0.3        # [1/día] exponente del ramp de desecación
  wash_threshold_mm: 40.0       # [mm] lluvia diaria que dispara lavado de cohortes (fuente única de los 3 nombres previos)
  wash_fraction_max: 0.60       # [fracción] fracción máxima de cohortes lavada por lluvia
  vulnerable_instar_max: 2      # [instar] último instar vulnerable a desecación (EGG + L1 + L2)

urban:
  beta_urban: 0.75              # [adimensional] H_urban = beta_urban · lc_built
  rain_pools_built_damage: 0.3  # [adimensional] h[open_pluvial] += valor · lc_built
                                # (potential.py aplica el mismo término)

species:
  default_species: coluzzii     # [string] fila de especie activa por defecto
  # K único del motor: UNA clave, no por especie — el engine tiene un solo
  # k_ref; K_ref per-species es extensión futura (version-bump).
  k_ref: 50.0   # [ind·km⁻²·d⁻¹] capacidad de Beverton-Holt por especie;
                # la versión py en OTRA unidad no entra (veredicto §9.1)
  # Pesos por especie, por NOMBRE de habitat_types. Mapping fila C++ ZoneId
  # {jrc, urban, wetland, open, crop, forest} → nombres YAML:
  #   jrc→surface_persistent, urban→urban_persistent, wetland→wetland_persistent,
  #   open→open_pluvial, crop→crop_pluvial, forest→(0; columna muerta, no entra).
  # wetland_pluvial = 0.00: las filas C++ no definen columna wetland separada; el peso
  # wetland C++ (en C++ < kNumPersistent ⇒ A=1) se asigna a la columna persistente
  # py, preservando la semántica de disponibilidad del motor.
  # v2 filas: activity_weights [DAY, EVENING, NIGHT, DAWN] Σ=1 (TimePhase order,
  # species_params.hpp); pref {human,cattle,goat,sheep,wildlife} = HostType Σ=1;
  # salinity: s = (1−frac)·exp(−slope·(psu−opt)), hard cap 0 en psu ≥ hi_tol.
  coluzzii:
    weights: {surface_persistent: 0.40, wetland_persistent: 0.10, urban_persistent: 0.20,
              wetland_pluvial: 0.00, open_pluvial: 0.25, crop_pluvial: 0.05}   # [fracción] afinidad por tipo de hábitat (Σ=1.00)
    activity_weights: [0.0, 0.255, 0.48, 0.265]         # [fracción] perfil horario por fase DAY/EVENING/NIGHT/DAWN (Σ=1.00); Akuoko 2024 (coluzzii, n=935): EE 18-22 h 25,5 %, LE 22-04 h 48,0 %, EM 04-06 h 26,5 %; DAY = 0 por falta de dato [P]
    pref: {human: 0.99, cattle: 0.005, goat: 0.003, sheep: 0.001, wildlife: 0.001}  # [fracción] preferencia por tipo de hospedador (Σ=1.00)
    salinity_opt_ppt: 0.0                               # [psu] salinidad óptima (factor = 1)
    salinity_hi_tol_ppt: 30.0                           # [psu] tolerancia máxima; por encima no cría
    salinity_slope: 0.08                                # [psu⁻¹] decaimiento del factor de salinidad
    co2_activation_radius_m: 100.0   # [m] radio de activación por CO₂ (tramo ACTIVACIÓN de la cascada) [P]
    olfactory_radius_m: 50.0   # [m] radio de rastreo olfativo de la pluma; banda 30–70 m, punto medio [P]
    visual_radius_m: 0.485   # [m] radio de la banda de aproximación visual; banda 0,25–0,72 m, punto medio [P]
    terminal_radius_m: 0.15   # [m] radio terminal (contacto); banda 0,10–0,20 m, punto medio [P]
    flight_speed_ms: 0.3375   # [m/s] velocidad propia de vuelo en busca; banda 0,225–0,45 m/s, punto medio [P]
    exploration_range_m: 100.0   # [m] radio del disco de exploración (>= co2_activation_radius_m); banda 100–200 m [EP]
    exploration_step_m: 50.0   # [m] longitud nominal del paso del paseo de exploración [EP]
    exploration_step_correlation: 0.5   # [adimensional] correlación paso–paso del paseo de exploración [EP]
    casting_probability: 0.1   # [1/paso de rastreo] probabilidad de perder la pluma y pasar a casting [EP]
    casting_angle_deg: 90.0   # [°] transversalidad del casting respecto al viento (90 ± 30) [EP]
    plume_memory_s: 0.7   # [s] memoria de la pluma (segmentos de cast, Cummins 2012); banda 0,5–0,9 s, punto medio; la fila manda sobre integration.plume_memory_s [P]
    anemotaxis_rule: "upwind"   # [categórico] regla de orientación respecto al viento (contra el viento) [EP]
    anemotaxis_deviation_deg: 30.0   # [°] desviación máxima respecto a la dirección contra el viento (± grados) [EP]
    wind_reference: "u100/v100"   # [string] variables del campo de viento (100 m AGL, ERA5 6-horario); único nivel disponible [M]
    wind_block_threshold_ms: 0.3375   # [m/s] umbral de bloqueo del avance contra el viento; por defecto = flight_speed_ms [EP]
    daily_move_capacity_m: 590.0   # [m] longitud máxima de trayectoria diaria (MDTpD), no desplazamiento neto; media de 486–695 m/día [P]
    directed_flight_budget_h: 0.4856   # [h] DERIVADO: daily_move_capacity_m / flight_speed_ms / 3600; consumible por día; la fila manda sobre integration.directed_flight_budget_h [EP]
    blood_meal_target_ul: 0.5   # [µL] objetivo de una comida completa [EP]
    first_cycle_target_ul: 0.8   # [µL] objetivo de la primera comida (> blood_meal_target_ul: hacen falta dos comidas) [EP]
    blood_meal_size_ul: 0.3   # [µL] media del volumen tomado por comida [EP]
    meal_size_min_ul: 0.1   # [µL] volumen mínimo de una comida válida [EP]
    blood_meal_refractory_days: 0.5   # [días] ventana postprandial tras alcanzar el objetivo [EP]
    probing_success_rate: 0.7275   # [fracción] probabilidad de éxito del sondeo por contacto; banda 0,465–0,99, punto medio; sustituye a gonotrophic.feeding_success_rate [EP]
    eggs_per_ul: 223.0   # [huevos/µL] huevos por µL de sangre acumulada; 0,5 µL dan ≈112 huevos (puesta medida 111,67 ± 5,36) [EP]
    arrested_daily_survival: 0.986   # [1/día] supervivencia diaria en arresto ovárico; 212·ln(0,986) ⇒ 0,05 a los 212 días de estivación [EP]
    gonotrophic_arrest_prob_dry: 0.2704   # [fracción] probabilidad de arresto gonotrófico en estación seca (punto medio de 19,23–34,85 / 40,09–48,98 / 68,12–68,64 % coluzzii / arabiensis / gambiae s.s.); sin dato en las demás filas ⇒ 0 [P]
    aestivation_supported: true   # [booleano] la especie estiva (arresto ovárico); sin evidencia en funestus, melas y stephensi [EP]
    male_ratio: 0.5   # [fracción] fracción de machos al emerger; neutral por defecto (la evidencia apunta a sesgo macho, Vielma et al. 2026) [EP]
    male_daily_survival: 0.773   # [1/día] supervivencia diaria del macho (0,773 ± 0,094, Epopa et al. 2017); separada de la hembra [M]
