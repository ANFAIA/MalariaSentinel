[project]
name = "malaria-sentinel"
version = "0.1.0"
description = "MalariaSentinel — AI-driven predictive malaria surveillance (monorepo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.24",
    "cdsapi>=0.7",
    "contextily>=1.6",
    "earthaccess>=0.12",
    "fastapi>=0.115",
    "geopandas>=1.0",
    "h5py>=3.10",
    "matplotlib>=3.11.0",
    "mesa-geo>=0.9.3,<0.10",
    "netcdf4>=1.7.4",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "planetary-computer>=1.0",
    "polars>=1.30.0",
    "pydantic>=2.7",
    "pyhdf>=0.11.7",
    "pystac-client>=0.8",
    "pyproj>=3.6",
    "rasterio>=1.5.0",
    "requests>=2.32",
    "rioxarray>=0.22.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "shapely>=2.0",
    "torch>=2.12.1",
    "typer>=0.12",
    "uvicorn>=0.30",
    "xarray>=2024.7",
    "gawt>=0.6.3",
]

[dependency-groups]
dev = [
    "gawt>=0.6.3",
]

[tool.uv]
package = false

# Lightweight sync profiles for the remote (Hetzner) runner. Each installs
# only the optional dependency groups a stage needs, skipping torch/fastapi
# when they are not required. Dev default stays `uv sync --all-packages`.
#
#   uv sync --package mal-core --group abm            # ABM + commonlib base
#   uv sync --package mal-core --group abm --group download --group ingest
#   uv sync --package mal-core --group train          # U-Net training (torch)
#   uv sync --package mal-core --group serve          # FastAPI server
[tool.uv.workspace]
members = [
    "mal-commonlib",
    "mal-core",
    "mal-execution",
    "mal-data-explorer",
    "social-networks",
    "agents/janus",
]
