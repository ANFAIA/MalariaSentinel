[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mal-janus"
version = "0.1.0"
description = "Janus — dispatcher orchestrator for MalariaSentinel ABM calibration"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "gawt>=0.5.0",
]

[project.optional-dependencies]
observability = ["langfuse>=3.0"]

[project.scripts]
janus = "agents_janus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_janus"]
