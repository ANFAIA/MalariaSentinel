[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mal-janus"
version = "0.1.0"
description = "LangChain deepagents-based orchestrator for MalariaSentinel ABM calibration"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
openrouter = ["langchain-openai>=0.3"]

[project.scripts]
janus = "agents.janus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"janus" = "agents.janus"
