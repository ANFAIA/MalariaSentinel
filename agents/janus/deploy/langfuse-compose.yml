# Langfuse self-host compose for Dockploy on Raspberry Pi 4 8GB.
#
# 3 services: postgres (auth + trace storage) + redis (queue) +
# langfuse-web (UI + API on :3000) + langfuse-worker (async processor).
#
# ClickHouse is REMOVED — the official Docker image requires ARMv8.2-A
# but Pi 4 is ARMv8.0-A (Cortex-A72). Langfuse falls back to Postgres
# for trace/observation storage, which is fine for single-user janus use.
#
# First boot: open https://<your-cloudflare-tunnel>, sign up, create a project
# named "janus", copy LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY into your Mac's
# .env file. Cloudflared config is separate — point at langfuse-web:3000.
#
# Pi 4 8GB sizing (without ClickHouse): ~600MB idle, ~1.5GB under load.
# Plenty of headroom. No ClickHouse = ~700MB RAM saved.

services:
  langfuse-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${LANGFUSE_PG_DB:-langfuse}
      POSTGRES_USER: ${LANGFUSE_PG_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD:-langfuse_pw}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_PG_USER:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - langfuse_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_PG_USER:-langfuse}:${LANGFUSE_PG_PASSWORD:-langfuse_pw}@langfuse-postgres:5432/${LANGFUSE_PG_DB:-langfuse}
      REDIS_URL: redis://langfuse-redis:6379
      SALT: ${LANGFUSE_SALT:-change-me-in-production-please-32-chars-min}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_LOG_LEVEL: info

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    ports:
      - "3001:3000"   # 3001 on host (3000 taken by Dockploy); cloudflared points at :3001
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-worker:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_PG_USER:-langfuse}:${LANGFUSE_PG_PASSWORD:-langfuse_pw}@langfuse-postgres:5432/${LANGFUSE_PG_DB:-langfuse}
      REDIS_URL: redis://langfuse-redis:6379
      SALT: ${LANGFUSE_SALT:-change-me-in-production-please-32-chars-min}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required (32+ char random)}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-malaria-sentinel}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-janus}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Janus}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Janus Admin}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_LOG_LEVEL: info

volumes:
  langfuse_pg:
  langfuse_redis: