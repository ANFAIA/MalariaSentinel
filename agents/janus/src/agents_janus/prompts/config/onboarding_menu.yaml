# Onboarding menu — YAML-driven, replaces hardcoded menu
menu:
  - key: "run_pipeline"
    label: "Run the full pipeline"
    description: "Execute all 6 stages (download → predict) for an AOI"
    action: "onboard_run_pipeline"
    
  - key: "run_abm"
    label: "Run ABM simulation"
    description: "Run the agent-based mosquito simulation"
    action: "onboard_run_abm"
    
  - key: "run_stage"
    label: "Run a specific stage"
    description: "Execute one pipeline stage (download, ingest, abm, score, train, predict)"
    action: "onboard_run_stage"
    
  - key: "check_status"
    label: "Check system status"
    description: "View scorecards, plans, and subagent status"
    action: "onboard_status"
    
  - key: "diagnose"
    label: "Diagnose an issue"
    description: "Analyze simulation problems with trajectory data"
    action: "onboard_diagnose"
    
  - key: "delegate"
    label: "Delegate code changes"
    description: "Hand off code-editing tasks to the improvement orchestrator"
    action: "onboard_delegate"
    
  - key: "list_components"
    label: "List components"
    description: "See all registered subagents and their capabilities"
    action: "onboard_list_components"
