version: 1

defaults:
  provider: openrouter
  model: xiaomi/mimo-v2.5
  thread_id_prefix: "sub-"
  tool_name_prefix: true
  default_deny: true
  fail_on_missing_tools: true
  global_deny_tools: []

servers:
  gitagent:
    transport: stdio
    command: uv
    args: [run, gitagent-mcp]
    cwd: <repo_root>
    env:
      MCP_LOG_LEVEL: ERROR

  codebase_memory:
    transport: stdio
    command: /Users/davidflorezmazuera/.local/bin/codebase-memory-mcp
    args: []
    cwd: <repo_root>
    # Optional dependency. Enable after CBM/Neo4j health check passes.
    enabled: false

index_on_startup:
  enabled: false
  project: MalariaSentinel
  repo_path: <repo_root>
  mode: moderate
  force: false

agents:
  request_router:
    kind: coordinator
    description: Routes each request to one coordinator.
    tools: []

  research_coordinator:
    kind: coordinator
    description: Routes read-only research to domain specialists.
    tools: [ask_user]

  implementation_coordinator:
    kind: coordinator
    description: Manages GAWT lifecycle and delegates repository work.
    servers: [gitagent]
    tools:
      - ask_user
      - mcp__gitagent__list_agents
      - mcp__gitagent__list_edits
      - mcp__gitagent__list_intents
      - mcp__gitagent__snapshot_session
      - mcp__gitagent__snapshot_status
      - mcp__gitagent__list_snapshots
      - mcp__gitagent__abort_session

  abm:
    kind: specialist
    description: ABM C++ engine + Mesa-Geo adapter + runner
    spec: docs/specs/abm/spec.md
    skills: [abm-engine, calibration-framework]
    gawt_role: abm
    servers: [gitagent, codebase_memory]
    tools:
      - mcp__gitagent__read_file
      - mcp__gitagent__edit_file
      - mcp__gitagent__write_file
      - mcp__gitagent__start_intent
      - codebase_search_graph
      - codebase_get_code_snippet
      - ask_user
      - resolve_conflict
      - execute
    edits_allow:
      - mal-core/src/mal_core/abm/**
      - mal-core/src/mal_core/abm/tests/calibration/**

  scoring:
    kind: specialist
    description: Calibration scorers + composite
    spec: docs/specs/scoring/spec.md
    skills: [calibration-framework]
    gawt_role: scoring
    servers: [gitagent, codebase_memory]
    tools:
      - mcp__gitagent__read_file
      - mcp__gitagent__edit_file
      - mcp__gitagent__write_file
      - mcp__gitagent__start_intent
      - codebase_search_graph
      - codebase_get_code_snippet
      - ask_user
      - resolve_conflict
    edits_allow:
      - mal-core/src/mal_core/abm/tests/calibration/**
      - mal-core/src/mal_core/scoring/**

  ingest:
