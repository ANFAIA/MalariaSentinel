# AOI registry — single source of truth for all slug → AOI mappings.
# To add a new AOI: uncomment and edit the example below.
# No code changes needed — AOI.from_slug() reads this file at runtime.
#
# Fields:
#   slug          — [a-z0-9-], max 64 chars (used in filenames, CLI --aoi)
#   name          — human-readable
#   bbox          — [west, south, east, north] in CRS units
#   crs           — EPSG code or WKT
#   resolution_m  — cell size in metres
#   scale         — regional | national | continental
#   gadm_id       — optional GADM identifier (e.g. "GHA" for country, "GHA.1_1" for region)
#   iso3          — ISO 3166-1 alpha-3 country code, REQUIRED for country-scoped
#                   loaders (WorldPop, GADM, livestock). Exactly 3 uppercase letters.

ghana:
  name: Ghana NMCP AOI
  bbox: [-3.5, 4.5, 1.5, 11.5]
  crs: "EPSG:4326"
  resolution_m: 1000
  scale: regional
  gadm_id: GHA
  iso3: GHA

accra-coastal-test:
  name: Accra Coastal Test AOI
  # Window moved 2026-10-29. The old bbox [0.05, 5.35, 0.60, 5.75] put the
  # shoreline in a corner: GSHHG full gives 2.9 % of its 2745 cells >=50 % land
  # and 94.8 % open sea. The new window keeps the Accra-Tema shoreline on the
  # south edge and runs inland to 6.0 N: 87.4 % of 3416 cells >=50 % land
  # (86.6 % >=95 %), 9.2 % open sea, 1.6 % partial-coast cells.
  bbox: [-0.45, 5.50, 0.10, 6.00]
  crs: "EPSG:4326"
  resolution_m: 1000
  scale: regional
  gadm_id: GHA
  iso3: GHA

