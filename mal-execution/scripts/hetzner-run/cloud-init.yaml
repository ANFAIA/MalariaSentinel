#cloud-config
# hetzner-run — baseline cloud-init for ephemeral MalariaSentinel VMs.
#
# First boot only. Idempotent if rerun (apt-get install is a no-op for the
# already-installed packages). Designed to leave a clean, reproducible
# machine in ~3 minutes.

write_files:
  - path: /etc/profile.d/uv.sh
    permissions: '0644'
    owner: root:root
    content: |
      # Added by hetzner-run cloud-init. uv lives under /usr/local/bin.
      export PATH="/usr/local/bin:${PATH}"

apt:
  preserve_sources_list: true
  conf: |
    APT {
      Get {
        Assume-Yes "true";
        Fix-Broken "true";
      };
    };

package_update: true
package_upgrade: false
packages:
  - python3.12
  - python3.12-venv
  - python3.12-dev
  - python3-pip
  - rsync
  - jq
  - ca-certificates
  - curl
  # Build toolchain for mal_abm_fast (cmake + ninja + deps).
  # build.sh writes bin/mal_abm_fast_linux after a successful build.
  - cmake
  - ninja-build
  - g++
  - libeigen3-dev
  - libgdal-dev
  - libcli11-dev
  - nlohmann-json3-dev
  - libomp-dev
  - libgtest-dev

runcmd:
  # Disable unattended-upgrades to avoid surprise reboots mid-job.
  - systemctl stop unattended-upgrades.service || true
  - systemctl disable unattended-upgrades.service || true
  - systemctl mask unattended-upgrades.service || true
  - |
    # Install uv (https://docs.astral.sh/uv/) for root. The standalone
    # installer places it under $HOME/.local/bin.
    curl -LsSf https://astral.sh/uv/install.sh | sh
    ln -sf /root/.local/bin/uv /usr/local/bin/uv || true
  - mkdir -p /work/code /work/data /work/runs
  - chmod 755 /work /work/code /work/data /work/runs
  - chown -R root:root /work
  # Drop a tiny motd so anyone SSHing in can see what this box is for.
  # NOTE: runcmd entries are parsed as YAML scalars, so any ': ' (colon-space)
  # inside a plain string becomes a mapping and fails cloud-init schema
  # validation. Keep this free of ': ' and quote it explicitly.
  - "printf 'MalariaSentinel ephemeral runner (hetzner-run)\\n  /work/code   source repos\\n  /work/data   input datasets\\n  /work/runs   output artifacts\\nDestroy this VM with hetzner-run destroy <name>\\n' > /etc/motd"
  - "echo hetzner-run cloud-init complete at $(date -u +%Y-%m-%dT%H:%M:%SZ) > /var/log/hetzner-run-cloud-init.log"
